  <line x1="18" y1="20" x2="30" y2="20" stroke="white" stroke-width="1" opacity="0.6"/>
  <circle cx="24" cy="20" r="2" fill="white" opacity="0.9"/>
  <circle cx="18" cy="20" r="1.2" fill="#52B2DC"/>
  <circle cx="30" cy="20" r="1.2" fill="#52B2DC"/>
  <!-- Lock body -->
  <rect x="20" y="28" width="8" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <path d="M21,28 Q21,23 24,23 Q27,23 27,28" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="32" r="1.5" fill="#0D7A87"/>
  <!-- WAF text -->
  <text x="24" y="44" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="5.5" fill="white" letter-spacing="0.5">WAF</text>
