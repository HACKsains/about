      <stop offset="0%" stop-color="#1D3B5E"/>
      <stop offset="100%" stop-color="#0D7A87"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7A87"/>
      <stop offset="100%" stop-color="#52B2DC"/>
    </linearGradient>
  </defs>
  <!-- Outer shield -->
  <path d="M24,3 L43,11 L43,29 Q43,42 24,47 Q5,42 5,29 L5,11 Z" fill="url(#wg)"/>
