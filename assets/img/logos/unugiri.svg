  <line x1="24" y1="30" x2="24" y2="42" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- NU text -->
  <text x="24" y="41" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="white" letter-spacing="1">NU</text>
