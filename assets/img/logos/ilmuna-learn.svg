<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7A87"/>
      <stop offset="100%" stop-color="#1D3B5E"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect x="3" y="3" width="42" height="42" rx="8" fill="url(#lg)"/>
  <!-- Monitor/screen -->
  <rect x="10" y="24" width="28" height="16" rx="2" fill="#1D3B5E" stroke="#52B2DC" stroke-width="1.5"/>
  <rect x="12" y="26" width="24" height="11" rx="1" fill="white" opacity="0.15"/>
  <!-- Screen stand -->
  <rect x="21" y="40" width="6" height="2" rx="1" fill="#52B2DC" opacity="0.8"/>
  <!-- Graduation cap -->
  <!-- Cap board -->
  <polygon points="24,8 38,14 24,20 10,14" fill="white" opacity="0.95"/>
  <!-- Cap top -->
  <rect x="21" y="8" width="6" height="4" rx="1" fill="#52B2DC" opacity="0.9"/>
  <!-- Tassel -->
  <line x1="38" y1="14" x2="38" y2="21" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="38" cy="21" r="1.5" fill="#52B2DC"/>
  <!-- Screen text lines -->
  <line x1="15" y1="30" x2="30" y2="30" stroke="#52B2DC" stroke-width="1" opacity="0.8"/>
  <line x1="15" y1="33" x2="27" y2="33" stroke="#52B2DC" stroke-width="1" opacity="0.6"/>
</svg>
