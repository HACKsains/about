<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="urg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3B5E"/>
      <stop offset="100%" stop-color="#0D7A87"/>
    </linearGradient>
  </defs>
  <!-- Circular background -->
  <circle cx="24" cy="24" r="22" fill="url(#urg)"/>
  <!-- Decorative ring -->
  <circle cx="24" cy="24" r="19" fill="none" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <!-- Academic cap -->
  <polygon points="24,10 36,16 24,22 12,16" fill="white" opacity="0.95"/>
  <rect x="22" y="10" width="4" height="3.5" rx="0.5" fill="#52B2DC" opacity="0.9"/>
  <!-- Tassel -->
  <line x1="36" y1="16" x2="36" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="36" cy="23" r="1.5" fill="#52B2DC"/>
  <!-- UR Monogram on book/scroll -->
  <rect x="13" y="26" width="22" height="14" rx="3" fill="white" opacity="0.15"/>
  <text x="24" y="37" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="11" fill="white" letter-spacing="0.5">UR</text>
  <!-- Publication lines decoration -->
  <line x1="13" y1="27.5" x2="35" y2="27.5" stroke="#52B2DC" stroke-width="0.8" opacity="0.5"/>
</svg>
